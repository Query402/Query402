name: CI / quality
on: [pull_request, push]

# CI never pushes changes back to the repository.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    # Bound total job runtime so a hung install, lint, or test step fails fast (<= 20 min)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Static asset guard
        run: |
          node --test scripts/check-static-assets.test.mjs
          node scripts/check-static-assets.mjs

      - name: Enable pnpm
        run: corepack enable

      - name: Repository malware guard
        run: |
          node scripts/check-repo-malware.mjs
          node --test scripts/check-repo-malware.test.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test
