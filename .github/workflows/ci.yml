name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify corepack-managed npm
        # setup-node@v4 reads `packageManager` in package.json and routes
        # npm through corepack. Smoke-check that the pinned version
        # actually took effect so a missing corepack on a future runner
        # fails loudly here instead of silently corrupting the lockfile
        # sync check downstream.
        run: |
          v=$(npm -v)
          echo "npm -v → $v"
          [[ "$v" == "11.9.0" ]] || (echo "::error::npm pin failed: got '$v', expected 11.9.0" && exit 1)

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Source artifact guard
        run: npm run check:source-artifacts
